<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Antrenman Takip</title>
<meta name="description" content="Günlük antrenman takibi — internetsiz çalışır, veriler telefonunuzda kalır.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="ikon-192.png">
<link rel="apple-touch-icon" href="ikon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Antrenman">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5f7" id="tcolor">
<style>
:root{
  --bg:#f4f5f7;--kart:#fff;--kart2:#eef0f4;--yazi:#16181d;--soluk:#5d6572;--cizgi:#d9dde4;
  --ana:#0b6bcb;--ana-yazi:#fff;--ok:#1a8a4a;--ok-bg:#dff3e7;--uyari:#b35c00;--uyari-bg:#fff0d9;--hata:#c0362c;--hata-bg:#fde4e1;
  --golge:0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-tema="acik"]){
  --bg:#0e1013;--kart:#1a1d23;--kart2:#252a32;--yazi:#eceff4;--soluk:#a0a8b5;--cizgi:#343a45;
  --ana:#4da3ff;--ana-yazi:#06182c;--ok:#5fd28b;--ok-bg:#16352a;--uyari:#ffb255;--uyari-bg:#3a2b12;--hata:#ff7b70;--hata-bg:#40201d;--golge:none}}
:root[data-tema="koyu"]{
  --bg:#0e1013;--kart:#1a1d23;--kart2:#252a32;--yazi:#eceff4;--soluk:#a0a8b5;--cizgi:#343a45;
  --ana:#4da3ff;--ana-yazi:#06182c;--ok:#5fd28b;--ok-bg:#16352a;--uyari:#ffb255;--uyari-bg:#3a2b12;--hata:#ff7b70;--hata-bg:#40201d;--golge:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--yazi);font:17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px)}
main{max-width:640px;margin:0 auto;padding:12px 14px 24px}
h1{font-size:1.45rem;margin:.2em 0 .1em}h2{font-size:1.15rem;margin:1.1em 0 .4em}h3{font-size:1.02rem;margin:0}
a{color:var(--ana)}p{margin:.4em 0}.soluk{color:var(--soluk)}.kucuk{font-size:.86rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;min-height:48px;padding:10px 18px;border-radius:14px;border:1px solid var(--cizgi);background:var(--kart);font-weight:600;text-decoration:none;color:var(--yazi)}
.btn.ana{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana)}
.btn.tehlike{color:var(--hata);border-color:var(--hata)}
.btn.blok{display:flex;width:100%}
.btn.kck{min-height:40px;padding:6px 12px;font-size:.92rem;border-radius:10px}
.kart{background:var(--kart);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--golge);border:1px solid var(--cizgi)}
.satir{display:flex;align-items:center;gap:10px}.satir.bol{justify-content:space-between}.wrap{flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 auto;min-width:44px;min-height:48px;padding:4px 8px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);text-align:center;font-size:.82rem;line-height:1.15}
.chip b{display:block;font-size:1.05rem}
.chip.sec{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana)}
.chip.bg{box-shadow:inset 0 -3px 0 var(--ok)}.chip.at{box-shadow:inset 0 -3px 0 var(--hata)}.chip.bu{border-color:var(--ana);border-width:2px}
.rozet{display:inline-block;min-width:1.9em;padding:2px 7px;border-radius:8px;background:var(--kart2);font-size:.8rem;font-weight:700;text-align:center}
.uyari{background:var(--uyari-bg);color:var(--uyari);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
.basari{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;margin:10px 0}
.bilgi-kutu{background:var(--kart2);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:.95rem}
/* sekmeler */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--kart);border-top:1px solid var(--cizgi);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;min-height:60px;padding:6px 2px;font-size:.74rem;color:var(--soluk);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:1.4rem;line-height:1}nav button.sec{color:var(--ana);font-weight:700}
/* hareket kartı */
.hk{padding:12px 12px 8px}
.hk h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hedef{font-weight:700;color:var(--ana)}
.gecen{font-size:.86rem;color:var(--soluk);margin:2px 0 6px}
.grup{border-left:5px solid var(--ana);border-radius:18px;margin:12px 0;padding:0 0 0 8px;background:linear-gradient(var(--kart2),var(--kart2)) 0 0/100% 100% no-repeat;position:relative}
.grup>.baslik{font-size:.78rem;font-weight:700;color:var(--ana);padding:6px 6px 0}
.grup .kart{margin:6px 8px 8px 0}
.set{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:center;margin:6px 0}
.set.sure,.set.yalniz{grid-template-columns:52px 1fr auto}
.set.yalniz{grid-template-columns:52px 1fr 1fr}
.chk{width:52px;height:52px;border-radius:14px;border:2px solid var(--cizgi);background:var(--kart);font-size:1.6rem;line-height:1;color:transparent;display:flex;align-items:center;justify-content:center}
.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.alan{display:flex;flex-direction:column;font-size:.7rem;color:var(--soluk);gap:2px}
.alan input{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);padding:6px 10px;font-size:1.1rem;text-align:center}
.alan.bos{visibility:hidden}
.setno{position:absolute;left:-9999px}
.ipucu{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:8px 12px;margin:8px 0;font-size:.92rem}
.sec-btn{display:inline-flex;min-height:36px;padding:2px 12px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kart);font-size:.84rem;font-weight:600}
.sec-btn.sec{background:var(--ana);color:var(--ana-yazi);border-color:var(--ana)}
.bilgi{margin:6px 0 10px;padding:10px;background:var(--kart2);border-radius:12px;font-size:.93rem}
.diag{display:flex;gap:6px;margin-bottom:6px}.diag figure{margin:0;flex:1;max-width:190px;text-align:center}
.diag svg{width:100%;height:auto;background:var(--kart);border-radius:10px}
.diag figcaption{font-size:.74rem;color:var(--soluk)}
.yt{display:inline-block;margin-top:4px;font-weight:600;color:var(--ana)}
.sn{stroke:var(--yazi);stroke-width:3.6;stroke-linecap:round}.sf{stroke:var(--yazi);stroke-opacity:.4;stroke-width:3.6;stroke-linecap:round}
.hd{fill:var(--kart);stroke:var(--yazi);stroke-width:3}.fl{stroke:var(--soluk);stroke-width:1.5}
.pl{stroke:#e08a1e;stroke-width:3;stroke-linecap:round}.pf{fill:#e08a1e}.pf2{fill:#e08a1e33;stroke:#e08a1e}.bd{stroke:#e08a1e;stroke-width:1.5;stroke-dasharray:3 2}.ar{fill:none;stroke:var(--ana);stroke-width:1.6}
/* kontrol listesi */
details.liste{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;margin:10px 0}
details.liste>summary{list-style:none;padding:14px;font-weight:700;display:flex;justify-content:space-between;gap:8px;min-height:52px;align-items:center}
details.liste>summary::-webkit-details-marker{display:none}
details.liste>summary::after{content:"▾";color:var(--soluk)}details.liste[open]>summary::after{content:"▴"}
.cl{display:flex;align-items:center;gap:10px;padding:4px 12px;min-height:50px;border-top:1px solid var(--cizgi)}
.cl .chk{width:40px;height:40px;font-size:1.3rem;border-radius:10px;flex:0 0 auto}
.cl .ad{flex:1}.cl.bitti .ad{color:var(--soluk);text-decoration:line-through}
.cl .i{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1px solid var(--cizgi);background:var(--kart);font-weight:700;color:var(--ana)}
.clb{padding:0 12px 10px}
/* zamanlayıcı */
#tbar{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 68px);z-index:30;display:none;background:var(--yazi);color:var(--bg);border-radius:18px;padding:10px 12px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:620px;margin:0 auto}
#tbar.ac{display:flex;gap:10px;align-items:center}#tbar .z{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;min-width:4.3ch}
#tbar .e{flex:1;font-size:.9rem;line-height:1.2}#tbar button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid rgba(128,128,128,.5);background:transparent;color:var(--bg);font-weight:700;padding:0 10px}
#tbar.bit{animation:fls .5s 4 alternate;background:var(--ok)}@keyframes fls{from{filter:brightness(1)}to{filter:brightness(1.8)}}
/* takvim */
.tak{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.tak .b{font-size:.72rem;text-align:center;color:var(--soluk)}
.hucre{aspect-ratio:1;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.9rem;padding:0;position:relative}
.hucre i{font-style:normal;font-size:.7rem;line-height:1}
.hucre.bitti{background:var(--ok-bg);color:var(--ok);font-weight:700}.hucre.kismi{background:var(--uyari-bg);color:var(--uyari)}
.hucre.atlandi{background:var(--hata-bg);color:var(--hata)}.hucre.dinlenme,.hucre.oncesi,.hucre.gelecek,.hucre.istege,.hucre.mac{color:var(--soluk)}
.hucre.bugun{outline:2px solid var(--ana)}.hucre.bos{visibility:hidden}
.ind{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin-top:8px}.ind span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
.ind .a::before{background:var(--ok-bg);border:1px solid var(--ok)}.ind .b::before{background:var(--uyari-bg);border:1px solid var(--uyari)}.ind .c::before{background:var(--hata-bg);border:1px solid var(--hata)}
.liste-h{display:flex;justify-content:space-between;align-items:center;min-height:52px;padding:8px 14px;background:var(--kart);border:1px solid var(--cizgi);border-radius:14px;margin:6px 0;width:100%;text-align:left}
table{width:100%;border-collapse:collapse;font-size:.92rem}td,th{padding:6px 4px;border-bottom:1px solid var(--cizgi);text-align:left;vertical-align:top}
svg.graf{width:100%;height:auto}.graf text{fill:var(--soluk);font-size:9px}.graf .gl{stroke:var(--ana);stroke-width:2;fill:none}.graf .gp{fill:var(--ana)}.graf .gz{stroke:var(--cizgi)}
/* form */
label.f{display:block;margin:10px 0;font-size:.85rem;color:var(--soluk)}
label.f input,label.f select,label.f textarea{display:block;width:100%;min-height:48px;margin-top:4px;border-radius:12px;border:1px solid var(--cizgi);background:var(--kart);padding:8px 12px;font-size:1rem;color:var(--yazi)}
textarea{min-height:90px!important;resize:vertical}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
#sheet.ac{display:flex}#sheet .p{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 20px)}
.prow{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--cizgi)}.prow .a{flex:1;min-width:0}.prow button{min-width:40px;min-height:40px;border-radius:10px;border:1px solid var(--cizgi);background:var(--kart)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 140px);background:var(--yazi);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;display:none;max-width:90%}
body.tm{padding-bottom:calc(env(safe-area-inset-bottom) + 170px)}
@media (min-width:700px){body{font-size:18px}}
</style>
</head>
<body>
<main id="app"></main>
<div id="tbar" role="timer" aria-live="polite"></div>
<div id="sheet"><div class="p" id="sheetIc"></div></div>
<div id="toast"></div>
<nav id="nav">
  <button data-a="sekme" data-v="bugun"><span>🏋️</span>Bugün</button>
  <button data-a="sekme" data-v="gecmis"><span>📅</span>Geçmiş</button>
  <button data-a="sekme" data-v="program"><span>📝</span>Program</button>
  <button data-a="sekme" data-v="ayar"><span>⚙️</span>Ayarlar</button>
</nav>

<script src="program.js"></script>
<script src="diyagram.js"></script>
<script src="hareketler.js"></script>
<script>
'use strict';
/* =================== Yardımcılar =================== */
const GUN = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const GUNK = ['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
const AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const pad = n => String(n).padStart(2, '0');
const dkey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return dkey(d); };
const bugun = () => dkey(new Date());
const dow = k => parse(k).getDay();
const haftaBas = k => addDays(k, -((parse(k).getDay() + 6) % 7));
const tarihMetin = k => { const d = parse(k); return GUN[d.getDay()] + ', ' + d.getDate() + ' ' + AY[d.getMonth()] + ' ' + d.getFullYear(); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = s => document.querySelector(s);
const kopya = o => JSON.parse(JSON.stringify(o));
function haftaAnahtari(k) { // ISO hafta
  const d = parse(k); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
  const w1 = new Date(d.getFullYear(), 0, 4);
  const hf = 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7);
  return d.getFullYear() + '-H' + pad(hf);
}

/* =================== Veri =================== */
const KEY = 'antrenmanTakip.v1';
function bosDB() { return { surum: 1, ayar: { dinlenmeSn: null, tema: 'oto', ses: true, sonYedek: null, ilkAcilis: Date.now(), uyariGizli: null }, program: null, kayit: {}, artis: { son: {}, hafta: {} } }; }
function yukle() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) return duzelt(JSON.parse(r));
  } catch (e) { console.warn(e); }
  return bosDB();
}
function duzelt(d) {
  const b = bosDB();
  d = d && typeof d === 'object' ? d : b;
  d.ayar = Object.assign(b.ayar, d.ayar || {});
  d.kayit = d.kayit && typeof d.kayit === 'object' ? d.kayit : {};
  d.artis = Object.assign(b.artis, d.artis || {});
  d.artis.son = d.artis.son || {}; d.artis.hafta = d.artis.hafta || {};
  d.program = d.program || null;
  return d;
}
let DB = yukle();
let depolamaHata = false;
function kaydet() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); depolamaHata = false; }
  catch (e) { if (!depolamaHata) toast('Kayıt yapılamadı! Tarayıcı depolaması dolu ya da kapalı olabilir. Yedek almayı deneyin.'); depolamaHata = true; }
}
const prog = () => DB.program || VARSAYILAN_PROGRAM;
const progD = () => { if (!DB.program) DB.program = kopya(VARSAYILAN_PROGRAM); return DB.program; };
const dinlenmeSn = () => DB.ayar.dinlenmeSn || prog().dinlenmeSn || 75;
function kayitOku(t) { return DB.kayit[t] || null; }
function kayitYaz(t) { // yazma için kayıt oluşturur
  if (!DB.kayit[t]) DB.kayit[t] = { liste: {}, hr: {}, tercih: {}, yorgun: null, not: '', bitti: null };
  const k = DB.kayit[t]; k.liste = k.liste || {}; k.hr = k.hr || {}; k.tercih = k.tercih || {};
  return k;
}

/* =================== Durum =================== */
const UI = { sekme: 'bugun', tarih: bugun(), elle: false, acik: {}, ay: bugun().slice(0, 7), hareket: null, pGun: null, pAra: '' };
let TOAST_T;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(TOAST_T); TOAST_T = setTimeout(() => t.style.display = 'none', 3800); }

/* =================== Program yardımcıları =================== */
function gunTanim(t) { return prog().gunler[dow(t)]; }
function etkinHareket(h, log) { // alternatif (pull-up → band lat pulldown) çözümlemesi
  if (h.alt && log && log.tercih && log.tercih[h.id] === 'alt') {
    return Object.assign({}, h.alt, { grup: h.grup, bolum: h.bolum, _ana: h.id, _altVar: true, kg: h.alt.kg });
  }
  return Object.assign({}, h, { _ana: h.id });
}
function gunHareketleri(t) {
  const g = gunTanim(t), log = kayitOku(t); if (!g) return [];
  const ana = (g.hareketler || []).map(h => etkinHareket(h, log));
  const bil = g.bilek ? (prog().bilek || []).map(h => Object.assign({}, h, { _ana: h.id, bolum: 'Bilek prehab' })) : [];
  return ana.concat(bil);
}
function hedefMetin(h) {
  let s;
  switch (h.tip) {
    case 'tekrar': s = h.set + '×' + h.tekrar; break;
    case 'taraf': s = h.set + '×' + h.tekrar + '/taraf'; break;
    case 'max': s = h.set + '×max'; break;
    case 'sureli': s = h.set + '×' + h.sn + ' sn' + (h.taraf ? '/taraf' : ''); break;
    default: s = h.set + ' set';
  }
  return s;
}
const kgVar = h => h.kg !== undefined;
const grupHarf = h => h.grup ? String(h.grup).replace(/\d+$/, '') : null;

/* geçmiş: bu hareketin kayıtlı seansları (tarih artan) */
function seanslar(id, ustSinir) {
  const r = [];
  Object.keys(DB.kayit).sort().forEach(t => {
    if (ustSinir && t >= ustSinir) return;
    const e = DB.kayit[t].hr && DB.kayit[t].hr[id];
    if (e && e.sets && e.sets.some(s => s && s.d)) r.push({ t, e });
  });
  return r;
}
function sonSeansMetni(h, t) {
  const s = seanslar(h.id, t); if (!s.length) return null;
  const e = s[s.length - 1].e, yap = e.sets.filter(x => x && x.d);
  const kgler = yap.map(x => parseFloat(String(x.k).replace(',', '.'))).filter(x => !isNaN(x) && x > 0);
  const tekr = yap.map(x => x.r).filter(x => x !== '' && x != null);
  let m = '';
  if (kgler.length) m += Math.max.apply(null, kgler) + ' kg × ';
  if (tekr.length) m += tekr.join('/') + (kgler.length ? '' : ' tekrar');
  else m += yap.length + ' set';
  return m;
}
function sonKg(h, t) { // yer tutucu için son kullanılan ağırlık
  const s = seanslar(h.id, t); if (!s.length) return null;
  const yap = s[s.length - 1].e.sets.filter(x => x && x.d && x.k !== '' && x.k != null);
  return yap.length ? yap[yap.length - 1].k : null;
}
function setTamam(e, h) { // seans bu hareketin tüm setlerini hedefe ulaştırdı mı
  const n = e.setSayi || h.set; let ok = true;
  for (let i = 0; i < n; i++) {
    const s = e.sets[i];
    if (!s || !s.d) { ok = false; break; }
    if ((e.tip === 'tekrar' || e.tip === 'taraf') && e.hedef) {
      if (!(parseFloat(s.r) >= e.hedef)) { ok = false; break; }
    }
  }
  return ok;
}
function artisHazir(h, t) {
  if (h.tip === 'max') return false;
  const s = seanslar(h.id).filter(x => x.t <= t);
  const son = DB.artis.son[h.id] || '';
  const sonIki = s.slice(-2);
  if (sonIki.length < 2) return false;
  if (sonIki.some(x => x.t <= son)) return false;
  return sonIki.every(x => setTamam(x.e, h));
}

/* =================== Zamanlayıcı =================== */
let AC = null, WL = null;
function sesAc() { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function bip(f, ms, gec) {
  if (!DB.ayar.ses || !AC) return;
  try {
    const t = AC.currentTime + (gec || 0) / 1000, o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.45, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + ms / 1000);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + ms / 1000 + .05);
  } catch (e) {}
}
function titre(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
function alarm() { bip(880, 220, 0); bip(880, 220, 320); bip(1175, 450, 640); titre([300, 120, 300, 120, 500]); }

let T = { a: false }, FLASH = 0;

function zamanlayiciBaslat(o) { // o: {tur, etiket, fazlar:[{e,sn}], bitince}
  sesAc(); tBitirSessiz();
  T = { a: true, tur: o.tur, fazlar: o.fazlar, i: 0, bitis: Date.now() + o.fazlar[0].sn * 1000, bitince: o.bitince, etiket: o.etiket };
  T.iv = setInterval(tik, 250); uyanikTut(); tik();
}
function tBitirSessiz() { if (T.a) { clearInterval(T.iv); T.a = false; uyanikBirak(); } cizTbar(); }
function tik() {
  if (!T.a) return;
  while (Date.now() >= T.bitis) {
    if (T.i < T.fazlar.length - 1) { T.i++; T.bitis += T.fazlar[T.i].sn * 1000; bip(660, 260, 0); titre(150); }
    else { tamamlandi(); return; }

}
function tamamlandi() {
  const cb = T.bitince, tur = T.tur;
  clearInterval(T.iv); T.a = false; uyanikBirak(); alarm(); FLASH = Date.now() + 2200;
  const bar = $('#tbar'); bar.className = 'ac bit';
  bar.innerHTML = '<div class="e"><b>' + (tur === 'dinlenme' ? 'Dinlenme bitti — sıradaki sete!' : 'Süre bitti ✓') + '</b></div><button data-a="tKapat">Tamam</button>';
  setTimeout(() => { if (!T.a) { bar.className = ''; bar.innerHTML = ''; document.body.classList.remove('tm'); } }, 4500);
  if (cb) cb();
}
function cizTbar() {
  const bar = $('#tbar');
  if (!T.a) { if (!bar.classList.contains('bit')) { bar.className = ''; bar.innerHTML = ''; document.body.classList.remove('tm'); } return; }
  const kalan = Math.max(0, Math.ceil((T.bitis - Date.now()) / 1000)), f = T.fazlar[T.i];
  bar.className = 'ac' + (Date.now() < FLASH ? ' bit' : ''); document.body.classList.add('tm');
  bar.innerHTML = '<div class="z">' + fmt(kalan) + '</div><div class="e"><b>' + esc(f.e) + '</b><br><span style="opacity:.75">' + esc(T.etiket || '') + '</span></div>' +
    (T.tur === 'dinlenme' ? '<button data-a="tFark" data-v="-15">−15</button><button data-a="tFark" data-v="15">+15</button>' : '') +
    '<button data-a="tAtla">' + (T.tur === 'dinlenme' ? 'Atla' : 'Durdur') + '</button>';
}

  zamanlayiciBaslat({ tur: 'dinlenme', etiket, fazlar: [{ e: 'Dinlenme', sn: dinlenmeSn() }] });
}

/* =================== Set işlemleri =================== */
function hrYaz(t, h) {
  const k = kayitYaz(t);
  if (!k.hr[h.id]) k.hr[h.id] = { ad: h.ad, tip: h.tip, hedef: h.tekrar || h.sn || null, setSayi: h.set, sets: [] };
  const e = k.hr[h.id]; e.ad = h.ad; e.tip = h.tip; e.hedef = h.tekrar || h.sn || null; e.setSayi = h.set; e.sets = e.sets || [];
  return e;
}
function setDegistir(t, h, i, yap, zamanlayicidan) {
  const e = hrYaz(t, h), s = e.sets[i] = e.sets[i] || { d: false, r: '', k: '' };
  s.d = yap;
  if (yap) {
    if ((h.tip === 'tekrar' || h.tip === 'taraf') && (s.r === '' || s.r == null)) s.r = String(h.tekrar);
    if (kgVar(h) && (s.k === '' || s.k == null)) {
      const son = sonKg(h, t), vars = h.kg;
      if (son != null) s.k = String(son); else if (vars != null) s.k = String(vars);
    }
  }
  kaydet();
  if (yap) {
    if (!zamanlayicidan) sesAc();
    const sira = gunHareketleri(t), harf = grupHarf(h);
    let baslat = true;
    if (harf) {
      const grup = sira.filter(x => grupHarf(x) === harf && x.set > i);
      baslat = grup.length ? grup[grup.length - 1].id === h.id : true;
    }
    if (baslat) dinlenmeBaslat(h.ad + ' — set ' + (i + 1) + ' bitti');
  }
}
function sureliBaslat(t, h, i) {
  const fazlar = [{ e: 'Hazırlan', sn: 5 }];
  if (h.taraf) { fazlar.push({ e: 'Sağ taraf', sn: h.sn }, { e: 'Sol taraf', sn: h.sn }); } else fazlar.push({ e: h.ad, sn: h.sn });
  zamanlayiciBaslat({ tur: 'sureli', etiket: h.ad + ' — set ' + (i + 1), fazlar, bitince: () => { setDegistir(t, h, i, true, true); render(); } });
}

/* --- Geçmiş --- */
function gunDurum(k) {
  const g = gunTanim(k), log = kayitOku(k), bg = bugun();
  if (log && log.bitti) return 'bitti';
  const veri = log && (Object.values(log.hr || {}).some(e => e.sets.some(x => x && x.d)) || Object.values(log.liste || {}).some(Boolean));
  if (veri) return 'kismi';
  if (k < prog().baslangic) return 'oncesi';
  if (k > bg) return 'gelecek';
  if (!g) return 'dinlenme';
  if (g.tur === 'antrenman') return k < bg ? 'atlandi' : 'bugun-bekliyor';
  if (g.tur === 'istege_bagli') return 'istege';
  if (g.tur === 'mac') return 'mac';
  return 'dinlenme';
}

    if (st === 'bitti') yapildi++; if (st === 'atlandi') atlandi++;

/* =================== Yedek / CSV =================== */
async function dosyaVer(ad, metin, tip, basarili) {
  const blob = new Blob([metin], { type: tip });
  try {
    const file = new File([blob], ad, { type: tip });
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: ad }); if (basarili) basarili(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = ad; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  if (basarili) basarili();
}
function yedekAl() {
  const veri = { uygulama: 'antrenman-takip', surum: 1, tarih: new Date().toISOString(), veri: DB };
  dosyaVer('antrenman-yedek-' + bugun() + '.json', JSON.stringify(veri, null, 1), 'application/json', () => { DB.ayar.sonYedek = Date.now(); kaydet(); toast('Yedek hazır. Dosyayı güvenli bir yere (Dosyalar / iCloud) kaydet.'); render(); });
}
function csvAl() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const satirlar = [['tarih', 'gun', 'hareket_id', 'hareket', 'set', 'tamamlandi', 'tekrar', 'kg', 'seans_notu', 'seans_bitti']];
  Object.keys(DB.kayit).sort().forEach(t => {
    const k = DB.kayit[t];
    Object.keys(k.hr || {}).forEach(id => { const e = k.hr[id]; (e.sets || []).forEach((s, i) => { if (s && (s.d || s.r || s.k)) satirlar.push([t, GUN[dow(t)], id, e.ad, i + 1, s.d ? 'evet' : 'hayır', s.r, String(s.k == null ? '' : s.k).replace('.', ','), k.not, k.bitti ? 'evet' : 'hayır']); }); });
  });
  dosyaVer('antrenman-' + bugun() + '.csv', '﻿' + satirlar.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
function geriYukle(dosya) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      if (!j || j.uygulama !== 'antrenman-takip' || !j.veri || typeof j.veri.kayit !== 'object') throw new Error('Bu dosya bir Antrenman Takip yedeği değil.');
      const n = Object.keys(j.veri.kayit).length;
      if (!confirm('Yedekte ' + n + ' günlük kayıt var.\n\nŞu anki veriler silinip yedektekilerle değiştirilecek. Devam edilsin mi?')) return;
      try { localStorage.setItem(KEY + '.onceki', JSON.stringify(DB)); } catch (e) {}
      DB = duzelt(j.veri); DB.ayar.sonYedek = Date.now(); kaydet(); temaUygula(); render(); toast('Yedek geri yüklendi (' + n + ' günlük kayıt).');
    } catch (e) { toast('Geri yükleme başarısız: ' + e.message); }
  };
  r.onerror = () => toast('Dosya okunamadı.');
  r.readAsText(dosya);
}
